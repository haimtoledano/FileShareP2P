version: '3.8'

services:
  signaling-server:
    build: .
    container_name: sharethis-server
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - ACCESS_KEY=${ACCESS_KEY}
      - METERED_API_KEY=${METERED_API_KEY}
      - METERED_SUBDOMAIN=${METERED_SUBDOMAIN}
      - STUN_SERVERS=${STUN_SERVERS}
      - TURN_SERVER_URL=${TURN_SERVER_URL}
      - TURN_SERVER_USERNAME=${TURN_SERVER_USERNAME}
      - TURN_SERVER_CREDENTIAL=${TURN_SERVER_CREDENTIAL}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
