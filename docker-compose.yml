version: '3.8'

services:
  signaling-server:
    build: .
    container_name: fileshare-p2p-server
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - ACCESS_KEY=${ACCESS_KEY}
      - METERED_API_KEY=${METERED_API_KEY}
      - METERED_SUBDOMAIN=${METERED_SUBDOMAIN}
    restart: unless-stopped
